# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "重做版"

[setup]
script = '''
set -euo pipefail

echo "[setup] cwd=$(pwd)"

# 1) 基础：如果有 .env.example 但没 .env，就复制一份（不含真实密钥）
if [ ! -f .env ] && [ -f .env.example ]; then
  cp .env.example .env
  echo "[setup] copied .env.example -> .env"
fi

# 2) Node / JS / TS：自动选择包管理器安装依赖
if [ -f package.json ]; then
  echo "[setup] detected Node project"

  # 让 pnpm/yarn 走 corepack（如果你用的是 node>=16/18）
  corepack enable >/dev/null 2>&1 || true

  if command -v pnpm >/dev/null 2>&1; then
    echo "[setup] pnpm install"
    pnpm install --frozen-lockfile || pnpm install
  elif command -v yarn >/dev/null 2>&1; then
    echo "[setup] yarn install"
    yarn install --immutable || yarn install
  else
    echo "[setup] npm install"
    npm ci || npm install
  fi
fi

# 3) Python：有 requirements 才装（避免误伤纯前端项目）
if [ -f requirements.txt ]; then
  echo "[setup] detected Python requirements.txt"
  python3 -m venv .venv 2>/dev/null || true
  . .venv/bin/activate
  pip install -r requirements.txt
fi

echo "[setup] done"
'''

[[actions]]
name = "deps:up"
icon = "tool"
command = "docker compose up -d"

[[actions]]
name = "deps:down"
icon = "tool"
command = "docker compose down"

[[actions]]
name = "dev"
icon = "run"
command = "npm run dev"

[[actions]]
name = "test"
icon = "tool"
command = "pnpm test"
